# Production stack for a self-hosted, always-on machine, published through a
# Cloudflare Tunnel.
#
# Nothing here publishes a host port. cloudflared dials out to Cloudflare and
# reaches the other services over the compose network, so the machine needs no
# inbound firewall rule at all. Route the hostnames in the Cloudflare dashboard:
#
#   api.<domain>    -> http://api:8000
#   admin.<domain>  -> http://admin-panel:80
#
# The customer site is not here: it is deployed to Vercel. This file used to
# build it from ./armonitex-web, a directory that does not exist, which meant
# the production stack could not build at all.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &api_env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@armonitex.com.tr}
      # Left at the sentinel the application checks for, which makes it log
      # messages instead of attempting SMTP. Any other placeholder makes it try
      # a real connection and fail quietly.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    # --forwarded-allow-ips: cloudflared terminates TLS and forwards over the
    # compose network, so without trusting its X-Forwarded-* headers the app
    # believes it is serving plain http. Upload responses are built from
    # request.base_url, so the admin panel would be handed http:// image URLs
    # and the browser would block them as mixed content. Trusting every peer is
    # safe here precisely because no port is published: only cloudflared can
    # reach this container.
    command:
      [
        "gunicorn",
        "-w",
        "4",
        "-k",
        "uvicorn.workers.UvicornWorker",
        "app.main:app",
        "--bind",
        "0.0.0.0:8000",
        "--forwarded-allow-ips",
        "*",
      ]
    environment: *api_env
    # Four workers means four copies of the booking sweeper. That is safe: it
    # claims rows with `FOR UPDATE SKIP LOCKED`, so the workers divide the work
    # rather than releasing the same seats twice.
    volumes:
      - tour_media_prod_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

  admin-panel:
    build:
      context: ./admin-panel
      target: prod
      args:
        # Baked into the bundle at build time; changing it needs a rebuild.
        VITE_API_URL: ${ADMIN_API_URL:?ADMIN_API_URL must be set, e.g. https://api.example.com/api/v1}
    depends_on:
      api:
        condition: service_started
    restart: always

  cloudflared:
    # Pin this once you have verified a version; an edge component is one of the
    # few places where tracking the current release is the safer default.
    image: cloudflare/cloudflared:latest
    restart: always
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_prod_data:
  tour_media_prod_data:
