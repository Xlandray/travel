server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Refine is a single-page app: every route below / is handled by the client
    # router, so anything that is not a real file has to fall back to index.html
    # or a browser refresh on /tours/edit/<id> would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers pointing at
    # asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
