name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: armonitex_ci
          POSTGRES_PASSWORD: armonitex_ci
          POSTGRES_DB: armonitex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U armonitex_ci -d armonitex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # conftest.py derives the ${POSTGRES_DB}_test database from this URL and
      # connects to the `postgres` database to create it.
      DATABASE_URL: postgresql+asyncpg://armonitex_ci:armonitex_ci@localhost:5432/armonitex_ci
      # Not a secret: this database and this job are thrown away with the runner.
      # The application refuses anything shorter than 32 characters.
      JWT_SECRET_KEY: ci-only-placeholder-key-not-used-anywhere-else
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install ".[test]" ruff

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest

  admin-panel:
    name: Admin panel (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend:
    name: Customer web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the api image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
