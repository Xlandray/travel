name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the same hooks as the local pre-commit install, so a commit pushed
  # with --no-verify is still caught here. Includes gitleaks secret scanning.
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install prettier for the local hooks
        run: npm ci --prefix frontend && npm ci --prefix admin-panel
      - uses: pre-commit/action@v3.0.1

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: armonitex_ci
          POSTGRES_PASSWORD: armonitex_ci
          POSTGRES_DB: armonitex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U armonitex_ci -d armonitex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # conftest.py derives the ${POSTGRES_DB}_test database from this URL and
      # connects to the `postgres` database to create it.
      DATABASE_URL: postgresql+asyncpg://armonitex_ci:armonitex_ci@localhost:5432/armonitex_ci
      # Not a secret: this database and this job are thrown away with the runner.
      # The application refuses anything shorter than 32 characters.
      JWT_SECRET_KEY: ci-only-placeholder-key-not-used-anywhere-else
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        # ruff comes from the pinned `dev` extra rather than an ad-hoc install,
        # so a fresh clone gets the same version this job uses.
        run: pip install ".[test,dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Test
        run: pytest

  admin-panel:
    name: Admin panel (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend:
    name: Customer web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Brings the documented stack up with one command and drives it through a
  # browser. This is also the only job that proves `docker compose up --build`
  # actually works from a clean checkout.
  e2e:
    name: End-to-end (compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write the env file
        # Throwaway values for a runner that is destroyed with the job. The app
        # refuses a JWT secret shorter than 32 characters.
        run: |
          cat > .env <<'ENV'
          POSTGRES_USER=armonitex
          POSTGRES_PASSWORD=ci-only-postgres-password
          POSTGRES_DB=armonitex
          JWT_SECRET_KEY=ci-only-placeholder-key-not-used-anywhere-else
          CORS_ALLOWED_ORIGINS=["http://localhost:3010","http://localhost:5181"]
          ENV

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the API and the web app
        run: |
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/v1/tours || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3010 || true)
            admin=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5181 || true)
            if [ "$api" = "200" ] && [ "$web" = "200" ] && [ "$admin" = "200" ]; then
              echo "stack is up after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "stack did not come up (api=$api web=$web admin=$admin)"; exit 1

      - name: Create the superuser the seed logs in as
        env:
          ADMIN_EMAIL: admin@armonitex.com.tr
          ADMIN_PASSWORD: Armonitex12345!
        run: |
          docker compose run --rm --no-deps \
            -e ADMIN_EMAIL -e ADMIN_PASSWORD \
            api python -m app.scripts.bootstrap_superuser

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: frontend
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3010
          ADMIN_PANEL_URL: http://localhost:5181
          NEXT_PUBLIC_API_URL: http://localhost:8081/api/v1
          E2E_ADMIN_EMAIL: admin@armonitex.com.tr
          E2E_ADMIN_PASSWORD: Armonitex12345!
        run: npm run test:e2e

      - name: Container logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            frontend/agent-report
            frontend/test-results
          retention-days: 7

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the api image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
