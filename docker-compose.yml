services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &api_environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8081}:8000"
    environment: *api_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/app:/app/app
      - tour_media_data:/app/media

  admin-panel:
    build:
      context: ./admin-panel
      # Required, not optional: the Dockerfile is multi-stage and its last stage
      # is the nginx production image listening on 80. Without this, `up` builds
      # that one and the port mapping below points at nothing.
      target: dev
    ports:
      - "${ADMIN_PORT:-5181}:5173"
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8081}/api/v1
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./admin-panel/src:/app/src

  armonitex-web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-3010}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8081}/api/v1
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  # Not started by `docker compose up`; run it with
  # `docker compose run --rm test`. It builds its own image so pytest and httpx
  # stay out of the runtime image, and it works on its own `*_test` database.
  test:
    build:
      context: ./backend
      args:
        INSTALL_TEST: "true"
    command: ["pytest"]
    environment: *api_environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/alembic:/app/alembic
    profiles: ["test"]

volumes:
  postgres_data:
  tour_media_data:
