[project]
name = "armonitex-api"
version = "0.1.0"
description = "Armonitex FastAPI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.116,<1.0",
    "pillow>=10.0,<12.0",
    "pyjwt>=2.10,<3.0",
    "pydantic[email]>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0.43,<2.1",
    "uvicorn[standard]>=0.35,<1.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "E501", "UP046"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
