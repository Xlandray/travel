[project]
name = "armonitex-api"
version = "0.1.0"
description = "Armonitex FastAPI backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.116,<1.0",
    "pillow>=10.0,<12.0",
    "pyjwt>=2.10,<3.0",
    "pydantic[email]>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0.43,<2.1",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.2",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, `import app` resolves to the copy pip baked into site-packages
# at image build time instead of the mounted working tree, and the suite
# silently tests stale code.
pythonpath = ["."]
asyncio_mode = "auto"
# Fixtures and tests must share one loop: the engine is session-scoped, and
# asyncpg connections cannot cross event loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "E501", "UP046"]

# No [tool.black]: `ruff format` is the formatter, and it is black-compatible.
# black was never installed or invoked anywhere, so its config only misled.

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
